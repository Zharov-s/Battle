<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>Монополия - Дожимаем месяц</title>
  <script>
    (()=>{let theme='dark';try{theme=localStorage.getItem('monopoly-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}document.documentElement.dataset.theme=theme;document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#091522':'#f3f6fa'})();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="./styles.css?v=18">
</head>
<body>
  <main class="page-shell">
    <section id="app" aria-live="polite">
      <div class="state-card"><div class="spinner"></div><h1>Монополия - Дожимаем месяц</h1><p>Загружаем данные из Google Sheets…</p></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="./config.js?v=14"></script>
  <script src="./app.js?v=18"></script>
</body>
</html>
